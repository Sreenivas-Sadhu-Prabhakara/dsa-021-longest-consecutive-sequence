<text x="56.0" y="216.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">(no 0 in the set); 2, 3, 4 don't, so their run is never re-walked.</text>
